<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Egenklang Plain</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <input id="name" aria-label="Title" spellcheck="false" autocomplete="off">
  <input id="author" aria-label="Author" placeholder="Author" spellcheck="false" autocomplete="off">
  <span id="status" role="status"></span>
  <nav>
    <button id="new">New</button>
    <button id="open">Open</button>
    <button id="save">Save</button>
    <button id="word">Word</button>
    <button id="pdf">PDF</button>
  </nav>
</header>
<main>
  <div id="paint" aria-hidden="true"></div>
  <textarea id="editor" aria-label="Text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="soft"></textarea>
</main>
<input id="picker" type="file" accept=".md,.markdown,.txt,text/plain,text/markdown" hidden>
<script src="js/markdown.js"></script>
<script src="js/metrics.js"></script>
<script src="js/docx.js"></script>
<script src="js/pdf.js"></script>
<script src="js/app.js"></script>
</body>
</html>
